name: G0 contracts and render smoke
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  g0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm FFmpeg runtime
        run: ffmpeg -version && ffprobe -version
      - name: Contract and actual media tests
        run: python -m unittest discover -s tests -v
