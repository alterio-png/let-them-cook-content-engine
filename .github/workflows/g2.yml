name: G2 real media execution and recovery
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  g2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install previously reviewed driver and FFmpeg
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-g1.lock
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
      - name: Real PostgreSQL, real media, failures and historical regressions
        run: |
          set -o pipefail
          G2_EVIDENCE_DIR=/tmp/ltc-g2-evidence G2_PYTHON=python sh scripts/run_g2_local.sh 2>&1 | tee g2-tests.txt
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-evidence-${{ github.sha }}
          path: |
            g2-tests.txt
            /tmp/ltc-g2-evidence/summary.json
            /tmp/ltc-g2-evidence/objects/
